<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1116" viewBox="0 0 1500 1116" font-family="Helvetica,Arial,sans-serif">
<rect width="1500" height="1116" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#33475b"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b45309"/></marker></defs>
<text x="34" y="42" font-size="19" font-weight="bold" fill="#1a1a1a">LogicPort frame exchanges: host to device, decoded 2026-10-29</text>
<text x="34" y="66" font-size="11.5" fill="#555555">Every accepted command returns an echo. One counter increments per command in both directions, so a gap detects a lost or duplicated frame.</text>
<rect x="370" y="92" width="200" height="34" rx="3" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="470" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#12385e">HOST (libftdi)</text>
<rect x="1110" y="92" width="200" height="34" rx="3" fill="#d5e8d4" stroke="#82b366"/>
<text x="1210" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4d1d">DEVICE (FPGA)</text>
<line x1="470" y1="126" x2="470" y2="946" stroke="#9bb7d4" stroke-dasharray="5,4"/>
<line x1="1210" y1="126" x2="1210" y2="946" stroke="#9bc49b" stroke-dasharray="5,4"/>
<text x="34" y="180" font-size="13.5" font-weight="bold" fill="#1f4e79">1: SEGMENT SELECT (C3)</text>
<text x="34" y="198" font-size="11" fill="#666666">sent once per bank change, then cached</text>
<line x1="470" y1="226" x2="1210" y2="226" stroke="#33475b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="34" y="230" font-size="11.5" font-weight="bold" fill="#33475b">HOST → DEV</text>
<rect x="684.8" y="200" width="310.40000000000003" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="214" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">C3 10 00 00 00   segment 0x0010 = command bank</text>
<line x1="1210" y1="282" x2="470" y2="282" stroke="#b45309" stroke-width="1.6" marker-end="url(#r)"/>
<text x="34" y="286" font-size="11.5" font-weight="bold" fill="#b45309">DEVICE → HOST</text>
<rect x="697.6" y="256" width="284.8" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="270" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">C3 00 01   exactly 3 bytes, echo validated</text>
<text x="34" y="348" font-size="13.5" font-weight="bold" fill="#1f4e79">2: REGISTER WRITE (C1)</text>
<text x="34" y="366" font-size="11" fill="#666666">frame then payload, then a 3-byte ack</text>
<line x1="470" y1="394" x2="1210" y2="394" stroke="#33475b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="34" y="398" font-size="11.5" font-weight="bold" fill="#33475b">HOST → DEV</text>
<rect x="678.4" y="368" width="323.20000000000005" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="382" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">C1 03 00 00 00 00   arm register, 1-byte payload</text>
<line x1="1210" y1="450" x2="470" y2="450" stroke="#b45309" stroke-width="1.6" marker-end="url(#r)"/>
<text x="34" y="454" font-size="11.5" font-weight="bold" fill="#b45309">DEVICE → HOST</text>
<rect x="748.8" y="424" width="182.4" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="438" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">C1 00 02   exactly 3 bytes</text>
<text x="34" y="516" font-size="13.5" font-weight="bold" fill="#1f4e79">3: REGISTER READ (C2)</text>
<text x="34" y="534" font-size="11" fill="#666666">request N, receive N + 4</text>
<line x1="470" y1="562" x2="1210" y2="562" stroke="#33475b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="34" y="566" font-size="11.5" font-weight="bold" fill="#33475b">HOST → DEV</text>
<rect x="707.2" y="536" width="265.6" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="550" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">C2 00 00 01 00   request 1 payload byte</text>
<line x1="1210" y1="618" x2="470" y2="618" stroke="#b45309" stroke-width="1.6" marker-end="url(#r)"/>
<text x="34" y="622" font-size="11.5" font-weight="bold" fill="#b45309">DEVICE → HOST</text>
<rect x="691.2" y="592" width="297.6" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="606" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">C2 00 03 00 42   4-byte header, then payload</text>
<text x="34" y="684" font-size="13.5" font-weight="bold" fill="#8b2c2c">4: INVALID FRAME</text>
<text x="34" y="702" font-size="11" fill="#666666">the command layer rejects and says so</text>
<line x1="470" y1="730" x2="1210" y2="730" stroke="#8b2c2c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="34" y="734" font-size="11.5" font-weight="bold" fill="#8b2c2c">HOST → DEV</text>
<rect x="736.0" y="704" width="208.0" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="718" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">99 00 00 00 00 61   bad opcode</text>
<line x1="1210" y1="786" x2="470" y2="786" stroke="#b45309" stroke-width="1.6" marker-end="url(#r)"/>
<text x="34" y="790" font-size="11.5" font-weight="bold" fill="#b45309">DEVICE → HOST</text>
<rect x="726.4" y="760" width="227.20000000000002" height="20" fill="#ffffff" stroke="#e0e0e0"/>
<text x="840" y="774" font-size="11" font-family="Menlo,monospace" text-anchor="middle" fill="#1a1a1a">EE 00 00   structured error reply</text>
<rect x="34" y="946" width="1432" height="146" rx="4" fill="#f7f7f7" stroke="#cccccc"/>
<text x="50" y="970" font-size="13" font-weight="bold" fill="#1a1a1a">Rules that bit the bench, all learned on hardware</text>
<text x="56" y="994" font-size="11" fill="#333333">•  Drain exactly 3 bytes after every C1 and C3. A C2 returns N + 4. A reply left unread desynchronises everything after it.</text>
<text x="56" y="1014" font-size="11" fill="#333333">•  The segment select is cached host-side and skipped when unchanged, so one C3 covers a run of accesses in the same bank.</text>
<text x="56" y="1034" font-size="11" fill="#333333">•  A segment select must be followed by a WRITE before any read. That frame order decided two device deaths, each costing a replug.</text>
<text x="56" y="1054" font-size="11" fill="#333333">•  A C3 with a non-zero segment wedged the device when followed by reads alone; with a write first it survived four segment changes.</text>
<text x="56" y="1074" font-size="11" fill="#333333">•  Reads must add the sample cursor to the plane offset. Reading planeOffset + 0 returns unwritten buffer and looks like an idle device.</text>
</svg>